# Layer configuration for meta-spotflow
# Provides: spotflowd observability daemon for the Spotflow platform

# Build the source checkout that contains this layer. Capture LAYERDIR now;
# another layer will change it later during parsing.
SPOTFLOWD_SOURCE_DIR := "${@os.path.abspath(os.path.join(d.getVar('LAYERDIR'), '..', '..'))}"

# Add the layer to BBPATH.
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-spotflow"
BBFILE_PATTERN_meta-spotflow = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-spotflow = "6"

LAYERDEPENDS_meta-spotflow = "core"
LAYERSERIES_COMPAT_meta-spotflow = "scarthgap styhead"
